# ============================================================
# Database Configuration
# ============================================================
# Supported types: "sqlite", "mariadb", "mysql"
#
# Notes:
# - For SQLite, "file" is used and host/port are ignored.
# - For MariaDB/MySQL, host/port/username/password are used.
# - Keep credentials out of public repositories.
# ============================================================

database:
  # Database backend to use.
  type: "sqlite" # sqlite, mariadb, mysql

  # ------------------------------------------------------------
  # SQLite settings (used when type = "sqlite")
  # ------------------------------------------------------------
  # Path relative to the plugin's data folder (recommended).
  # Example absolute paths also work, but are less portable.
  file: "database.sqlite"

  # ------------------------------------------------------------
  # MariaDB/MySQL settings (used when type = "mariadb" or "mysql")
  # ------------------------------------------------------------
  host: "127.0.0.1"
  port: 3306
  name: "nexframework"
  username: "root"
  password: ""
  useSSL: false

  # Optional JDBC parameters appended to the JDBC URL.
  # Example:
  # jdbcParameters: "useUnicode=true&characterEncoding=utf8&serverTimezone=UTC"
  jdbcParameters: ""

  # ============================================================
  # Connection Pool (HikariCP)
  # ============================================================
  # Tip:
  # - SQLite usually does NOT benefit from large pools.
  # - For SQLite, prefer maximumPoolSize: 1..2
  advanced:
    poolName: "nexframework-hikari"

    # Max number of connections in the pool.
    maximumPoolSize: 2

    # Minimum number of idle connections kept in the pool.
    minimumIdle: 1

    # Timeouts (milliseconds)
    connectionTimeoutMillis: 30000
    idleTimeoutMillis: 600000

    # Maximum lifetime of a connection (milliseconds).
    # For SQLite, you can set this to 0 to disable it.
    maxLifetimeMillis: 0

# ============================================================
# Hibernate / JPA settings
# ============================================================
hibernate:
  hbm2ddl:
    # "validate" (recommended for production), "update" (development), "create", "create-drop"
    auto: "update"

  # Extra Hibernate properties (string -> string).
  # Example:
  # additionalHibernateProperties:
  #   hibernate.jdbc.time_zone: "UTC"
  #   hibernate.show_sql: "false"
  additionalHibernateProperties: {}